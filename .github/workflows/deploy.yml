name: Multi-Region Safe Phased Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: acrkel2bcp2026kr
  IMAGE_NAME: academic-portal
  RG_NAME: rg-konsorsium-bcp
  PREFIX: kel2bcp2026

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Login dan Build Push via Docker CLI
        env:
          ACR_PWD: ${{ secrets.ACR_PASSWORD }}
          SHA: ${{ github.sha }}
        run: |
          SERVER=$(echo "$ACR_NAME" | awk '{print $1".azurecr.io"}')
          echo "$ACR_PWD" | docker login "$SERVER" -u "$ACR_NAME" --password-stdin
          docker build -t "$SERVER/$IMAGE_NAME:$SHA" .
          docker push "$SERVER/$IMAGE_NAME:$SHA"

  deploy-region-a:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Login ke Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Stamp Region A (Indonesia Central)
        env:
          ACR_PWD: ${{ secrets.ACR_PASSWORD }}
          SHA: ${{ github.sha }}
        run: |
          SERVER=$(az acr show -n $ACR_NAME -g $RG_NAME --query loginServer -o tsv)
          az deployment group create \
            --resource-group $RG_NAME \
            --template-file infra/stamp.bicep \
            --parameters \
              location=indonesiacentral \
              prefix=$PREFIX \
              acrLoginServer=$SERVER \
              acrUsername=$ACR_NAME \
              acrPassword=$ACR_PWD \
              containerImage=$SERVER/$IMAGE_NAME:$SHA \
              probePath=/health/ready \
              targetPort=8000

      - name: Smoke Test Region A
        run: |
          FQDN=$(az containerapp show -n app-$PREFIX-indonesiacentral -g $RG_NAME --query properties.configuration.ingress.fqdn -o tsv)
          PROTO="https"
          TARGET="$PROTO://$FQDN/health/ready"
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET")
            echo "Cek Region A ($i): HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Region A SEHAT!"
              exit 0
            fi
            sleep 6
          done
          exit 1

  deploy-region-b:
    needs: deploy-region-a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Login ke Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Stamp Region B (East Asia)
        env:
          ACR_PWD: ${{ secrets.ACR_PASSWORD }}
          SHA: ${{ github.sha }}
        run: |
          SERVER=$(az acr show -n $ACR_NAME -g $RG_NAME --query loginServer -o tsv)
          az deployment group create \
            --resource-group $RG_NAME \
            --template-file infra/stamp.bicep \
            --parameters \
              location=eastasia \
              prefix=$PREFIX \
              acrLoginServer=$SERVER \
              acrUsername=$ACR_NAME \
              acrPassword=$ACR_PWD \
              containerImage=$SERVER/$IMAGE_NAME:$SHA \
              probePath=/health/ready \
              targetPort=8000

      - name: Smoke Test Region B
        run: |
          FQDN=$(az containerapp show -n app-$PREFIX-eastasia -g $RG_NAME --query properties.configuration.ingress.fqdn -o tsv)
          PROTO="https"
          TARGET="$PROTO://$FQDN/health/ready"
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET")
            echo "Cek Region B ($i): HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Region B SEHAT! Rollout Selesai."
              exit 0
            fi
            sleep 6
          done
          exit 1
